services:
  sahifa:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    user: "1000:1000" # must own ./data — see backend/README.md
    volumes:
      - ./data:/app/data # database, media, receipts — back this folder up
    ports:
      - "127.0.0.1:8000:8000" # only the host sees it; Tailscale Funnel publishes it
    restart: unless-stopped
